name: Facilities Maintenance CI

# Run automated checks whenever code is pushed
# or a pull request targets the main branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # -----------------------------------------------
  # Backend: Java 21 + Maven + JUnit
  # -----------------------------------------------
  backend:
    name: Backend - Build and Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Run our three verified Mockito unit tests.
      # These do not require a PostgreSQL connection.
      - name: Run JUnit unit tests
        run: ./mvnw -B -Dtest=MaintenanceRequestServiceTest test

      # Package the backend after tests pass.
      # Tests already ran in the previous step.
      - name: Build Spring Boot application
        run: ./mvnw -B -DskipTests package

  # -----------------------------------------------
  # Frontend: Node.js + Vue + TypeScript
  # -----------------------------------------------
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vue application
        run: npm run build